# macOS Code Sign & Notarize — mrv2
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#
#   MACOS_CERTIFICATE_BASE64   Base64-encoded Developer ID .p12 certificate.
#                              Generate with:
#                                base64 -i cert.p12 | pbcopy
#
#   P12_PASSWORD               Password that protects the .p12 file.
#
#   DEVELOPER_ID               Full certificate name as it appears in
#                              Keychain Access, e.g.:
#                              "Developer ID Application: Jane Doe (ABCDE12345)"
#
#   APPLE_ID                   Apple ID (email) tied to your developer account.
#
#   TEAM_ID                    10-character Apple Team ID from developer.apple.com.
#
#   APP_PASSWORD               App-specific password created at
#                              appleid.apple.com → Sign-In and Security.
#                              (Used to store notarytool credentials in the
#                               ephemeral keychain — @keychain: prefix not
#                               needed in CI because we create the keychain
#                               fresh each run.)
#
# Optional secrets (fall back to the defaults shown):
#
#   NOTARYTOOL_PROFILE         Keychain profile name [mrv2-notarytool]
#   MRV2_APP                   Main app bundle name  [mrv2.app]
#   VMRV2_APP                  Vulkan app bundle     [vmrv2.app]
#   HDR_APP                    HDR app bundle        [hdr.app]  set "" to skip

name: OpenGL MacOS M1

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:

jobs:
  ###################################
  #                                 #
  # FULL BUILDS                     #
  #                                 #
  ###################################
  macos-14-full-build:
    runs-on: macos-14
    permissions:
      contents: write
    
    # ── Timeout ──────────────────────────────────────────────────────────────
    # Notarization can take several minutes; 30 min is a safe upper bound.
    # timeout-minutes: 30
    
    env:
      CMAKE_OSX_DEPLOYMENT_TARGET: 14.0
      # ── Passed through to codesign_notarize.sh ───────────────────────────
      DEVELOPER_ID:         ${{ secrets.DEVELOPER_ID }}
      APPLE_ID:             ${{ secrets.APPLE_ID }}
      TEAM_ID:              ${{ secrets.TEAM_ID }}
      NOTARYTOOL_PROFILE:   ${{ secrets.NOTARYTOOL_PROFILE || 'mrv2-notarytool' }}
      
      # Ephemeral keychain details (not secret — unique per run)
      KEYCHAIN_NAME:     build-${{ github.run_id }}.keychain
      KEYCHAIN_PASSWORD: ephemeral-${{ github.run_id }}

    steps:

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install ccache
        run: brew install ccache

      - name: Configure ccache
        run: |
          echo "DEVELOPER_ID=${DEVELOPER_ID}"
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_DATE=$(date +'%Y-%m')" >> $GITHUB_ENV
          ccache --max-size=500M
          
      - name: Import Developer ID Certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          #  # Decode the base64 certificate to a temporary .p12 file.
          # CERT_FILE="$(mktemp).p12"
          # echo "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_FILE}"

          # # Create an ephemeral keychain.
          # security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"

          # # Make it the default so codesign/xcrun pick it up automatically.
          # security default-keychain -s "${KEYCHAIN_NAME}"
          # security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"

          # # Keep the keychain unlocked for the duration of the job
          # # (default lock timeout is 300 s which can be too short for notarization).
          # security set-keychain-settings -lut 7200 "${KEYCHAIN_NAME}"

          # # Import the certificate — allow codesign and xcrun to use it.
          # security import "${CERT_FILE}" \
          #   -k "${KEYCHAIN_NAME}" \
          #   -P "${P12_PASSWORD}" \
          #   -T /usr/bin/codesign \
          #   -T /usr/bin/xcrun

          # # Grant codesign access without an interactive prompt.
          # security set-key-partition-list \
          #   -S apple-tool:,apple: \
          #   -s \
          #   -k "${KEYCHAIN_PASSWORD}" \
          #   "${KEYCHAIN_NAME}"

          # # Add our keychain to the search list so it is found alongside
          # # the system keychain.
          # security list-keychains -d user -s "${KEYCHAIN_NAME}" \
          #   "$(security list-keychains -d user | sed -e 's/[[:space:]]//g' -e 's/"//g' | tr '\n' ' ')"

          # # Scrub the .p12 file immediately.
          # rm -f "${CERT_FILE}"
          true

      # ── 4. Store notarytool credentials in the ephemeral keychain ─────────
      #
      # xcrun notarytool submit uses the keychain profile stored here.
      # Because the keychain is ephemeral we must do this on every run.
      - name: Store notarytool credentials
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          echo "APP_PASSWORD=${APP_PASSWORD}"
          
          # xcrun notarytool store-credentials "${NOTARYTOOL_PROFILE}" \
          #   --apple-id  "${APPLE_ID}" \
          #   --team-id   "${TEAM_ID}" \
          #   --password  "${APP_PASSWORD}" \
          #   --keychain  "${KEYCHAIN_NAME}"
          true
          
      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-OpenGL-ccache-${{ env.CCACHE_DATE }}
          restore-keys: |
              ${{ runner.os }}-${{ runner.arch }}-OpenGL-ccache-
              
      - name: Get machine name
        run: |
          echo "Machine name: $RUNNER_NAME"

      - name: Install ninja-build
        run: brew install ninja

      - name: Install gettext
        run: brew install gettext

      - name: Install automake and other network utils
        run: brew install automake autoconf curl rsync

      - name: Install GNU utils
        run: brew install gnu-sed coreutils

      - name: Install Python dependencies
        run: brew install libb2 libffi readline sqlite3 xz zlib

      - name: Install pyFLTK dependencies
        run: |
          brew install swig pcre bison

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix pcre2)/bin" >> "$GITHUB_PATH"
        
      - name: Install curl dependencies
        run: brew install libidn2

      - name: Setup environment
        run: mkdir -p ssh

      - name: Decode SSH key
        run: echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ssh/id_rsa
        shell: bash

      - name: Set permissions on SSH key
        run: chmod 600 ssh/id_rsa

      - name: Decode FLTK SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FLTK_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Add SourceForge to known_hosts
        shell: bash
        run: ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts

      - name: Set executable permissions
        run: |
          chmod +x ./*.sh ./bin/*.sh ./etc/*.sh ./bin/release/*.sh ./etc/macos/*.sh

      - name: Build mrv2
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          INSTALL_CMAKE: ON
          BUILD_PYTHON: ON
          MRV2_PYFLTK: ON
          MRV2_PYBIND11: ON
          MRV2_NETWORK: ON
          MRV2_PDF: ON
          MRV2_VK: ON
          TLRENDER_AV1: ON
          TLRENDER_EXR: ON
          TLRENDER_FFMPEG: ON
          TLRENDER_FFMPEG_MINIMAL: ON
          TLRENDER_HAP: ON
          TLRENDER_JPEG: ON
          TLRENDER_NDI: OFF
          TLRENDER_NET: ON
          TLRENDER_OPENJPH: ON
          TLRENDER_RAW: ON
          TLRENDER_SGI: ON
          TLRENDER_STB: ON
          TLRENDER_SVTAV1: ON
          TLRENDER_TIFF: ON
          TLRENDER_USD: ON
          TLRENDER_VK: OFF
          TLRENDER_VPX: ON
          TLRENDER_YASM: ON
        run: ./etc/runme_nolog.sh -t package clean

      - name: Upload binaries
        run: ./bin/release/upload_sourceforge.sh

      # ── 12. Cleanup — delete the ephemeral keychain ───────────────────────
      # This step runs even if earlier steps fail so the certificate is
      # never left behind on the runner.
      - name: Delete ephemeral keychain
        if: always()
        run: |
          # security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
          true

