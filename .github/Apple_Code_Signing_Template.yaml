name: Build, Sign, and Notarize macOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-sign:
    runs-on: macos-latest  # Runs natively on Apple Silicon hardware

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Developer ID Certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 1. Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 2. Decode and import the .p12 certificate
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Application
        run: |
          # Insert your compilation / build commands here (e.g., cmake, make, xcodebuild)
          echo "Building application..."

      - name: Code Sign Application
        run: |
          # Hardened runtime (--options runtime) is REQUIRED for notarization
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: Your Name or Org (TEAM_ID)" \
            path/to/@mrv2_NAME@.app

      - name: Package DMG
        run: |
          # Create your DMG package here
          hdiutil create -volname "@mrv2_NAME@" -srcfolder path/to/@mrv2_NAME@.app -ov -format UDZO path/to/@mrv2_NAME@.dmg

      - name: Notarize DMG with Apple
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APPSTORE_KEY_BASE64 }}
        run: |
          # Save API Key file required by notarytool
          mkdir -p ~/.private_keys
          echo "$KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_$KEY_ID.p8

          # Submit to Apple and wait for approval
          xcrun notarytool submit path/to/@mrv2_NAME@.dmg \
            --key ~/.private_keys/AuthKey_$KEY_ID.p8 \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait

      - name: Staple Ticket to DMG
        run: |
          # Attach the notarization ticket so it works offline
          xcrun stapler staple path/to/@mrv2_NAME@.dmg
